name: Release

# Push a tag such as v0.2.0 and this builds the installer and update packages, and publishes them as a GitHub Release.
# The tag is the version: v0.2.0 releases version 0.2.0.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      REPO_URL: https://github.com/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Work out the version
        shell: pwsh
        run: |
          # v0.9 releases 0.9.0. Versions below 1.0 are published as pre-releases.
          $version = '${{ github.ref_name }}'.TrimStart('v')
          if ($version -match '^\d+\.\d+$') { $version = "$version.0" }
          $pre = if ($version.StartsWith('0.') -or $version.Contains('-')) { 'true' } else { 'false' }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PRERELEASE=$pre" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Test
        shell: pwsh
        run: |
          dotnet test tests/SpeedBudget.Core.Tests -c Release
          if ($LASTEXITCODE -ne 0) { exit 1 }
          dotnet test tests/SpeedBudget.Data.Tests -c Release
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Fetch earlier releases (so updates can be small deltas)
        shell: pwsh
        continue-on-error: true
        run: |
          dotnet tool restore
          dotnet vpk download github --repoUrl $env:REPO_URL --outputDir artifacts/releases --token ${{ secrets.GITHUB_TOKEN }}

      - name: Build the installer and update packages
        shell: pwsh
        run: ./scripts/package.ps1 -Version $env:VERSION

      - name: Publish the release
        shell: pwsh
        run: |
          $extra = @()
          $name = "Speed Budget $env:VERSION"
          if ($env:PRERELEASE -eq 'true') { $extra += '--pre'; $name += ' (pre-release)' }
          dotnet vpk upload github --repoUrl $env:REPO_URL --outputDir artifacts/releases `
            --publish --releaseName $name --tag '${{ github.ref_name }}' @extra `
            --token ${{ secrets.GITHUB_TOKEN }}
