name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build the app
        run: dotnet build src/SpeedBudget.App -c Release -p:Platform=x64

      - name: Test
        run: dotnet test tests/SpeedBudget.Core.Tests -c Release; if ($LASTEXITCODE -eq 0) { dotnet test tests/SpeedBudget.Data.Tests -c Release }
        shell: pwsh
